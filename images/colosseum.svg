<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360" role="img" aria-labelledby="colosseumTitle">
  <title id="colosseumTitle">Stylized illustration of the Colosseum, Rome</title>
  <!-- Sky background -->
  <rect x="0" y="0" width="300" height="360" fill="#f7e6cf"/>
  <!-- Ground -->
  <rect x="0" y="330" width="300" height="30" fill="#c9b28a"/>

  <!-- Outer amphitheater wall, drawn as a ring so the top row of arches reads clearly -->
  <g stroke="#a56a3a" stroke-width="2" fill="#d9a066">
    <ellipse cx="150" cy="260" rx="130" ry="70"/>
    <ellipse cx="150" cy="260" rx="130" ry="70" fill="none" stroke="#8a4a24" stroke-width="3"/>
  </g>

  <!-- Top row of arches suggested with repeated openings -->
  <g fill="#f7e6cf" stroke="#8a4a24" stroke-width="1.5">
    <ellipse cx="60" cy="235" rx="12" ry="18"/>
    <ellipse cx="90" cy="222" rx="12" ry="18"/>
    <ellipse cx="120" cy="213" rx="12" ry="18"/>
    <ellipse cx="150" cy="210" rx="12" ry="18"/>
    <ellipse cx="180" cy="213" rx="12" ry="18"/>
    <ellipse cx="210" cy="222" rx="12" ry="18"/>
    <ellipse cx="240" cy="235" rx="12" ry="18"/>
  </g>

  <!-- Lower tier band -->
  <path d="M 25 260 A 125 55 0 0 0 275 260 L 275 300 A 125 55 0 0 1 25 300 Z" fill="#c9885a" stroke="#8a4a24" stroke-width="2"/>

  <!-- caption -->
  <text x="150" y="352" font-family="Arial, sans-serif" font-size="14" fill="#5c3a1e" text-anchor="middle">Colosseum</text>
</svg>
