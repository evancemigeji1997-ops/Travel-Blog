<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360" role="img" aria-labelledby="eiffelTitle">
  <title id="eiffelTitle">Stylized illustration of the Eiffel Tower, Paris</title>
  <!-- Sky background -->
  <rect x="0" y="0" width="300" height="360" fill="#cfe8f7"/>
  <!-- Ground -->
  <rect x="0" y="330" width="300" height="30" fill="#8fbf7a"/>

  <!-- Tower silhouette built from stacked trapezoids to suggest the tapering lattice structure -->
  <g fill="#4a4a4a" stroke="#2f2f2f" stroke-width="2" stroke-linejoin="round">
    <!-- base legs -->
    <polygon points="60,330 240,330 190,250 110,250"/>
    <!-- lower section -->
    <polygon points="110,250 190,250 172,175 128,175"/>
    <!-- mid section -->
    <polygon points="128,175 172,175 160,110 140,110"/>
    <!-- upper section -->
    <polygon points="140,110 160,110 152,60 148,60"/>
    <!-- antenna -->
    <rect x="148" y="30" width="4" height="30"/>
  </g>

  <!-- Cross-lattice lines for visual texture, not literal engineering detail -->
  <g stroke="#2f2f2f" stroke-width="1.5" fill="none" opacity="0.6">
    <line x1="60" y1="330" x2="190" y2="250"/>
    <line x1="240" y1="330" x2="110" y2="250"/>
    <line x1="110" y1="250" x2="172" y2="175"/>
    <line x1="190" y1="250" x2="128" y2="175"/>
    <line x1="128" y1="175" x2="160" y2="110"/>
    <line x1="172" y1="175" x2="140" y2="110"/>
  </g>

  <!-- caption -->
  <text x="150" y="352" font-family="Arial, sans-serif" font-size="14" fill="#2f2f2f" text-anchor="middle">Eiffel Tower</text>
</svg>
